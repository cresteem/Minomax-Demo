<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="./css/one.css">
	<link rel="stylesheet" href="./css/two.css">
	<title>Home</title>
</head>

<body>
	<h1>Responsive Images</h1>
	<div>
		<picture>
			<source media="(max-width:3840px)" srcset="..\..\images\set2\5X\cat@5X.false">
			<source media="(max-width:2560px)" srcset="..\..\images\set2\4X\cat@4X.false">
			<source media="(max-width:1920px)" srcset="..\..\images\set2\3X\cat@3X.false">
			<source media="(max-width:1080px)" srcset="..\..\images\set2\2X\cat@2X.false">
			<source media="(max-width:600px)" srcset="..\..\images\set2\1X\cat@1X.false"><img
				src="..\..\images\set2\2X\cat@2X.false" id="cat" alt="Cat" loading="lazy">
		</picture>
		<picture>
			<source media="(max-width:3840px)" srcset="..\..\images\set2\5X\dog@5X.false">
			<source media="(max-width:2560px)" srcset="..\..\images\set2\4X\dog@4X.false">
			<source media="(max-width:1920px)" srcset="..\..\images\set2\3X\dog@3X.false">
			<source media="(max-width:1080px)" srcset="..\..\images\set2\2X\dog@2X.false">
			<source media="(max-width:600px)" srcset="..\..\images\set2\1X\dog@1X.false"><img
				src="..\..\images\set2\2X\dog@2X.false" class="dog another" alt="Dog" style="width: 20px;">
		</picture>
		<picture>
			<source media="(max-width:3840px)" srcset="..\..\images\set2\5X\horse@5X.false">
			<source media="(max-width:2560px)" srcset="..\..\images\set2\4X\horse@4X.false">
			<source media="(max-width:1920px)" srcset="..\..\images\set2\3X\horse@3X.false">
			<source media="(max-width:1080px)" srcset="..\..\images\set2\2X\horse@2X.false">
			<source media="(max-width:600px)" srcset="..\..\images\set2\1X\horse@1X.false"><img
				src="..\..\images\set2\2X\horse@2X.false" id="horse" class="animal" alt="Horse" loading="eager">
		</picture>
		<picture>
			<source media="(max-width:3840px)" srcset="..\..\images\set2\5X\flower@5X.false">
			<source media="(max-width:2560px)" srcset="..\..\images\set2\4X\flower@4X.false">
			<source media="(max-width:1920px)" srcset="..\..\images\set2\3X\flower@3X.false">
			<source media="(max-width:1080px)" srcset="..\..\images\set2\2X\flower@2X.false">
			<source media="(max-width:600px)" srcset="..\..\images\set2\1X\flower@1X.false"><img
				src="..\..\images\set2\2X\flower@2X.false" class="flower" alt="Flower">
		</picture>
		<img src="..\..\images\set2\svg\java.svg" alt="java">
	</div>
	<a href="#cat"></a>
</body>

</html>
