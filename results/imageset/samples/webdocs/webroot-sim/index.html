<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>300 Images</title>
	<style>
		img {
			width: 200px;
			/* Default width for the smallest screens */
		}

		/* Media queries for different screen sizes */
		@media (min-width: 201px) and (max-width: 600px) {
			img {
				width: 200px;
				/* Default for very small screens */
			}
		}

		@media (min-width: 601px) and (max-width: 1080px) {
			img {
				width: 600px;
				/* 1X */
			}
		}

		@media (min-width: 1081px) and (max-width: 1920px) {
			img {
				width: 1080px;
				/* 2X */
			}
		}

		@media (min-width: 1921px) and (max-width: 2560px) {
			img {
				width: 1920px;
				/* 3X */
			}
		}

		@media (min-width: 2561px) and (max-width: 3840px) {
			img {
				width: 2560px;
				/* 4X */
			}
		}

		@media (min-width: 3841px) {
			img {
				width: 3840px;
				/* 5X */
			}
		}
	</style>
</head>

<body>

	<picture><source media="(max-width:3840px)" srcset="..\..\images\set1\5X\1@5X.false"><source media="(max-width:2560px)" srcset="..\..\images\set1\4X\1@4X.false"><source media="(max-width:1920px)" srcset="..\..\images\set1\3X\1@3X.false"><source media="(max-width:1080px)" srcset="..\..\images\set1\2X\1@2X.false"><source media="(max-width:600px)" srcset="..\..\images\set1\1X\1@1X.false"><img src="..\..\images\set1\2X\1@2X.false" alt="Image 1"> </picture>
	<picture><source media="(max-width:3840px)" srcset="..\..\images\set1\5X\2@5X.false"><source media="(max-width:2560px)" srcset="..\..\images\set1\4X\2@4X.false"><source media="(max-width:1920px)" srcset="..\..\images\set1\3X\2@3X.false"><source media="(max-width:1080px)" srcset="..\..\images\set1\2X\2@2X.false"><source media="(max-width:600px)" srcset="..\..\images\set1\1X\2@1X.false"><img src="..\..\images\set1\2X\2@2X.false" alt="Image 2"> </picture>
	<picture><source media="(max-width:3840px)" srcset="..\..\images\set1\5X\3@5X.false"><source media="(max-width:2560px)" srcset="..\..\images\set1\4X\3@4X.false"><source media="(max-width:1920px)" srcset="..\..\images\set1\3X\3@3X.false"><source media="(max-width:1080px)" srcset="..\..\images\set1\2X\3@2X.false"><source media="(max-width:600px)" srcset="..\..\images\set1\1X\3@1X.false"><img src="..\..\images\set1\2X\3@2X.false" alt="Image 3"> </picture>
	<picture><source media="(max-width:3840px)" srcset="..\..\images\set1\5X\4@5X.false"><source media="(max-width:2560px)" srcset="..\..\images\set1\4X\4@4X.false"><source media="(max-width:1920px)" srcset="..\..\images\set1\3X\4@3X.false"><source media="(max-width:1080px)" srcset="..\..\images\set1\2X\4@2X.false"><source media="(max-width:600px)" srcset="..\..\images\set1\1X\4@1X.false"><img src="..\..\images\set1\2X\4@2X.false" alt="Image 4"> </picture>

</body>

</html>
